<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rora</title>
<meta name="description" content="Rora. Let them roam. Keep them close." />
<!-- PRE-LAUNCH: keeps the placeholder site out of search results. REMOVE this tag at launch. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#FDF6F1" />

<link rel="stylesheet" href="./styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  .fade-up {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 1100ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .d1 { animation-delay: 150ms; }
  .d2 { animation-delay: 400ms; }
  .d3 { animation-delay: 650ms; }
  .d4 { animation-delay: 900ms; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .fade-up { animation: none; opacity: 1; transform: none; }
  }
</style>

<main class="flex min-h-screen flex-col items-center justify-center bg-cream px-6 py-16 text-center font-sans text-charcoal antialiased selection:bg-ember selection:text-white">

  <h1 class="fade-up text-[clamp(1.9rem,4.2vw,2.75rem)] font-bold tracking-tightest text-ember">Rora</h1>

  <p class="fade-up d1 mt-12 max-w-xl text-[clamp(1.875rem,5vw,3rem)] font-bold leading-[1.06] tracking-tightest">
    Let them roam.<br />Keep them close.
  </p>

  <p class="fade-up d2 mt-6 max-w-md text-lg leading-relaxed text-muted">
    A smart safety collar for dogs, learning to spot what's off. Arriving mid 2027.
  </p>

  <!-- TODO: replace this illustration with photography of the real collar. -->
  <div class="fade-up d2 mt-10 w-full max-w-[16rem]">
    <svg viewBox="0 0 400 270" role="img" aria-label="Illustration of the Rora collar" class="h-auto w-full">
      <defs>
        <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E9DCD2" />
          <stop offset="1" stop-color="#BCA79A" />
        </linearGradient>
        <linearGradient id="puck" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3A322D" />
          <stop offset="1" stop-color="#1A1411" />
        </linearGradient>
      </defs>
      <ellipse cx="200" cy="243" rx="104" ry="11" fill="#1A1411" opacity="0.06" />
      <ellipse cx="200" cy="118" rx="142" ry="80" fill="none" stroke="url(#band)" stroke-width="26" />
      <ellipse cx="200" cy="118" rx="142" ry="80" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" />
      <rect x="161" y="152" width="78" height="70" rx="22" fill="url(#puck)" />
      <circle cx="200" cy="187" r="15" fill="#0E0B09" />
      <circle cx="200" cy="187" r="6" fill="#D94A16" />
    </svg>
  </div>

  <!-- Waitlist. Submissions are collected by Netlify Forms; see the dashboard.
       Field order matters: the dog fields sit ABOVE the submit button, because
       anything below the CTA is never seen by people who just sign up. -->
  <form id="waitlist" name="waitlist" method="POST" data-netlify="true"
        netlify-honeypot="bot-field" novalidate
        class="fade-up d3 mt-10 w-full max-w-md">

    <input type="hidden" name="form-name" value="waitlist" />
    <p class="hidden"><label>Leave this field empty <input name="bot-field" /></label></p>

    <label for="email" class="sr-only">Email address</label>
    <input id="email" name="email" type="email" required autocomplete="email"
           placeholder="you@example.com"
           class="w-full rounded-full border border-line bg-transparent px-5 py-3 text-base text-charcoal outline-none transition placeholder:text-faint focus:border-ember" />

    <!-- Breed drives beta cohort selection; size is the first-run sizing mix. -->
    <div class="mt-5 text-left">
      <label for="breed" class="sr-only">Breed</label>
      <input id="breed" name="breed" type="text" autocomplete="off" maxlength="60"
             placeholder="Breed, or mix (optional)"
             class="w-full rounded-full border border-line bg-transparent px-5 py-3 text-base text-charcoal outline-none transition placeholder:text-faint focus:border-ember" />

      <fieldset class="mt-5">
        <legend class="mb-3 text-xs uppercase tracking-[0.18em] text-faint">Their size</legend>
        <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
          <label class="cursor-pointer">
            <input type="radio" name="size" value="Small" class="peer sr-only" />
            <span class="block rounded-full border border-line py-2.5 text-center text-sm text-muted transition hover:border-ember peer-checked:border-ember peer-checked:bg-ember peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-ember/40">Small</span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="size" value="Medium" class="peer sr-only" />
            <span class="block rounded-full border border-line py-2.5 text-center text-sm text-muted transition hover:border-ember peer-checked:border-ember peer-checked:bg-ember peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-ember/40">Medium</span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="size" value="Large" class="peer sr-only" />
            <span class="block rounded-full border border-line py-2.5 text-center text-sm text-muted transition hover:border-ember peer-checked:border-ember peer-checked:bg-ember peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-ember/40">Large</span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="size" value="Not sure" class="peer sr-only" />
            <span class="block rounded-full border border-line py-2.5 text-center text-sm text-muted transition hover:border-ember peer-checked:border-ember peer-checked:bg-ember peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-ember/40">Not sure</span>
          </label>
        </div>
      </fieldset>
    </div>

    <button type="submit"
            class="mt-7 w-full rounded-full bg-ember px-7 py-3.5 text-sm font-semibold text-white transition hover:bg-ember-dark disabled:opacity-60">
      Notify me
    </button>
  </form>

  <p id="msg" role="status" aria-live="polite" class="fade-up d3 mt-5 min-h-[1.25rem] text-sm text-muted"></p>
  <p id="fineprint" class="fade-up d3 mt-1 text-xs text-faint">No spam. Occasional build updates.</p>

  <footer class="fade-up d4 mt-20 text-xs text-faint">
    &copy; 2026 Rora
  </footer>
</main>

<script>
  (function () {
    'use strict';
    var form = document.getElementById('waitlist');
    var msg = document.getElementById('msg');
    var fineprint = document.getElementById('fineprint');
    var emailEl = document.getElementById('email');
    var button = form.querySelector('button[type="submit"]');

    function say(text, isError) {
      msg.classList.toggle('text-ember', !!isError);
      msg.classList.toggle('text-muted', !isError);
      msg.textContent = text;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value.trim())) {
        say('Please enter a valid email address.', true);
        emailEl.focus();
        return;
      }

      var size = form.querySelector('input[name="size"]:checked');
      if (!size) {
        say('Please pick a size, or choose Not sure.', true);
        form.querySelector('input[name="size"]').focus();
        return;
      }

      button.disabled = true;
      button.textContent = 'Sending';

      // Netlify Forms collects submissions posted back to the page itself.
      fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(form)).toString()
      })
        .then(function (res) {
          if (!res.ok) throw new Error(res.status);
          form.hidden = true;
          fineprint.hidden = true;
          say("You're on the list. We'll be in touch.");
        })
        .catch(function () {
          button.disabled = false;
          button.textContent = 'Notify me';
          say('That did not send. Please try again in a moment.', true);
        });
    });
  })();
</script>
